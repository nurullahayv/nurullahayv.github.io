# ─────────────────────────────────────────────────────────────
# Build settings — bunlara dokunmana genelde gerek yok
# ─────────────────────────────────────────────────────────────

# GitHub Pages'in izin verdiği eklentiler. Listeye başka bir şey ekleme,
# GitHub Pages onu çalıştırmaz ve site sessizce eski halinde kalır.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Ders Notları kategorileri. Sıra buradaki sıradır — notlar sayfasında bu düzende
# gruplanır. Yeni kategori eklemek için buraya bir satır ekle; notun front
# matter'ında `category:` alanına o satırdaki `key` değerini yaz.
# Buradaki bir `key` ile eşleşmeyen notlar sayfanın sonunda "Diğer / Other" altına düşer.
# Her kategorinin Türkçe (name_tr) ve İngilizce (name_en) görünen adı vardır.
note_categories:
  - key: sayisal
    name_tr: "Sayısal Tasarım"
    name_en: "Digital Design"
  - key: rl
    name_tr: "RL"
    name_en: "RL"
  - key: dl
    name_tr: "DL"
    name_en: "DL"
  - key: llm
    name_tr: "LLM"
    name_en: "LLM"
  - key: math
    name_tr: "Matematik ve Cebir"
    name_en: "Math & Algebra"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: text

collections:
  thoughts:
    output: true
    permalink: /thoughts/:name/
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope: { path: "", type: thoughts }
    values: { layout: post, lang: tr }
  - scope: { path: "", type: notes }
    values: { layout: note, lang: tr }
  - scope: { path: "" }
    values: { layout: page, lang: tr }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - content/
  - vendor/
  - .claude/
